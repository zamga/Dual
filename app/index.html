<meta charset="utf-8">
<title>Rok Credit Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Martian+Mono:wdth,wght@75..112.5,300..600&family=Schibsted+Grotesk:ital,wght@0,400..700;1,400&display=swap">
<style>
  /* Rok: banknote security print. Tokens first, light then dark. */
  :root {
    --paper: #eef1ee;
    --paper-2: #e5e9e5;
    --card: #fafbf9;
    --ink: #121a1e;
    --ink-2: #2b363b;
    --muted: #5c686c;
    --faint: #8c979a;
    --rule: #d6dcd8;
    --rule-strong: #bcc5c0;
    --accent: #0b7a75;
    --accent-ink: #ffffff;
    --accent-wash: #dcebe8;
    --good: #2f7d55;
    --warn: #a86a18;
    --crit: #b23a30;
    --info: #3f6d8e;
    --g-Ap: #0e7a6b;
    --g-A: #2f8457;
    --g-Bp: #6a8b3a;
    --g-B: #9a8526;
    --g-Cp: #b8741f;
    --g-C: #bf5627;
    --g-D: #ae3a2e;
    --g-E: #8e2637;
    --g-X: #5a1f2c;
    --veil: rgba(238, 241, 238, 0.82);
    --lift: 0 1px 0 rgba(18, 26, 30, 0.04), 0 12px 32px -18px rgba(18, 26, 30, 0.18);

    --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0c1215;
      --paper-2: #0a0f11;
      --card: #131b1f;
      --ink: #e5ece8;
      --ink-2: #c5d0cc;
      --muted: #8f9c9f;
      --faint: #66737a;
      --rule: #222d33;
      --rule-strong: #33414a;
      --accent: #4cc3b5;
      --accent-ink: #06201d;
      --accent-wash: #15302d;
      --good: #5dc08a;
      --warn: #e3a24c;
      --crit: #f0796c;
      --info: #86b3d6;
      --g-Ap: #4cc3b5;
      --g-A: #6cc58e;
      --g-Bp: #a8c46a;
      --g-B: #d6c25a;
      --g-Cp: #e7a451;
      --g-C: #ee8659;
      --g-D: #f0706a;
      --g-E: #e0607a;
      --g-X: #c0566e;
      --veil: rgba(12, 18, 21, 0.82);
      --lift: 0 1px 0 rgba(0, 0, 0, 0.3), 0 16px 40px -20px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0c1215;
    --paper-2: #0a0f11;
    --card: #131b1f;
    --ink: #e5ece8;
    --ink-2: #c5d0cc;
    --muted: #8f9c9f;
    --faint: #66737a;
    --rule: #222d33;
    --rule-strong: #33414a;
    --accent: #4cc3b5;
    --accent-ink: #06201d;
    --accent-wash: #15302d;
    --good: #5dc08a;
    --warn: #e3a24c;
    --crit: #f0796c;
    --info: #86b3d6;
    --g-Ap: #4cc3b5;
    --g-A: #6cc58e;
    --g-Bp: #a8c46a;
    --g-B: #d6c25a;
    --g-Cp: #e7a451;
    --g-C: #ee8659;
    --g-D: #f0706a;
    --g-E: #e0607a;
    --g-X: #c0566e;
    --veil: rgba(12, 18, 21, 0.82);
    --lift: 0 1px 0 rgba(0, 0, 0, 0.3), 0 16px 40px -20px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01";
  }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 500; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  a { color: var(--accent); }
  ::selection { background: var(--accent-wash); }

  .num { font-family: var(--mono); font-stretch: 87.5%; font-variant-numeric: tabular-nums; font-weight: 400; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .label {
    font: 600 10.5px/1.2 var(--sans);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .display { font-family: var(--display); font-optical-sizing: auto; }

  /* ---------- masthead ---------- */
  .mast {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--veil);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--rule);
  }
  .mast-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding-inline: 24px;
    display: flex;
    align-items: stretch;
    gap: 36px;
    min-height: 60px;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand svg { width: 30px; height: 30px; color: var(--accent); flex: none; }
  .brand-word { font: 600 27px/1 var(--display); letter-spacing: -0.02em; }
  .brand-word i { font-style: italic; font-weight: 400; color: var(--accent); }
  .tabs { display: flex; gap: 26px; }
  .tabs a {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: var(--muted);
    font-weight: 500;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding-top: 2px;
  }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  .stamp {
    margin-left: auto;
    align-self: center;
    font: 500 10.5px/1 var(--mono);
    font-stretch: 87.5%;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--warn);
    border: 1px solid currentColor;
    padding: 6px 9px;
    border-radius: 3px;
    white-space: nowrap;
  }

  main { max-width: 1360px; margin: 0 auto; padding-block: 28px 72px; padding-inline: 24px; }
  .view[hidden] { display: none; }

  /* ---------- desk ---------- */
  .desk { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
  .ledger {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 84px);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 108px);
    min-height: 0;
  }
  .ledger-head { display: grid; gap: 12px; padding-bottom: 14px; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
  .search {
    width: 100%;
    padding: 11px 12px 11px 36px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--card);
    outline: none;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  .search::placeholder { color: var(--faint); }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .filter {
    border: 0;
    background: none;
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--muted);
  }
  .filter:hover { color: var(--ink); background: var(--paper-2); }
  .filter[aria-pressed="true"] { color: var(--ink); background: var(--card); box-shadow: inset 0 0 0 1px var(--rule-strong); }
  .rows { list-style: none; margin: 0; padding: 0; overflow-y: auto; border-top: 1px solid var(--rule); min-height: 0; }
  .rows li { border-bottom: 1px solid var(--rule); }
  .rows button {
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    padding: 10px 6px 10px 12px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 1px 12px;
    cursor: pointer;
    position: relative;
  }
  .rows button::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 2px;
    border-radius: 2px;
    background: transparent;
  }
  .rows button:hover { background: var(--paper-2); }
  .rows button[aria-current="true"] { background: var(--card); }
  .rows button[aria-current="true"]::before { background: var(--accent); }
  .row-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-side { grid-row: 1 / span 2; grid-column: 2; align-self: center; display: flex; align-items: center; gap: 8px; }
  .ledger-foot { padding-top: 10px; font-size: 12px; color: var(--faint); }
  .flag { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }

  .grade {
    --g: var(--g-B);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    height: 22px;
    padding: 0 6px;
    border-radius: 5px;
    font: 600 13px/1 var(--display);
    color: var(--g);
    background: color-mix(in oklab, var(--g) 13%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--g) 28%, transparent);
  }

  /* ---------- dossier ---------- */
  .dossier { display: grid; gap: 22px; min-width: 0; }
  .panel {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--lift);
    border: 1px solid var(--rule);
    padding: 24px;
    min-width: 0;
  }
  .plain { padding: 4px 2px; min-width: 0; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .sec-title { font: 500 21px/1.2 var(--display); letter-spacing: -0.01em; }
  .sec-title i { color: var(--muted); font-weight: 400; }

  /* Certificate */
  .cert {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 236px;
    gap: 28px;
    padding: 30px 32px 26px;
  }
  .cert::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    pointer-events: none;
  }
  .cert-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .cert-name {
    font: 500 clamp(32px, 4.4vw, 52px)/1.02 var(--display);
    letter-spacing: -0.025em;
    margin-top: 10px;
  }
  .cert-name .form { font-style: italic; font-weight: 400; color: var(--muted); font-size: 0.55em; letter-spacing: 0; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 14px 22px; margin-top: 22px; }
  .facts div { display: grid; gap: 3px; min-width: 0; }
  .facts .v { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts .v.num { font-size: 12.5px; }
  .pd-block { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; margin-top: 26px; }
  .pd-big { font: italic 400 clamp(46px, 6vw, 72px)/0.9 var(--display); letter-spacing: -0.03em; color: var(--pdc, var(--ink)); }
  .pd-big small { font-size: 0.45em; font-style: normal; margin-left: 4px; }
  .pd-caption { font-size: 13px; color: var(--muted); max-width: 26ch; padding-bottom: 6px; }
  .ribbon { margin-top: 20px; display: grid; gap: 6px; max-width: 560px; }
  .ribbon-bar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
  .ribbon-bar span { height: 6px; border-radius: 3px; background: var(--g); opacity: 0.28; }
  .ribbon-bar span.on { opacity: 1; height: 10px; margin-top: -2px; }
  .ribbon-keys { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; font: 500 12px/1 var(--display); color: var(--faint); text-align: center; }
  .ribbon-keys span.on { color: var(--ink); font-weight: 700; }
  .sources { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 22px; }
  .source {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-2);
    background: var(--paper);
    border-radius: 999px;
    padding: 5px 11px 5px 9px;
  }
  .source .flag { width: 7px; height: 7px; }
  .seal-wrap { display: grid; justify-items: center; align-content: start; gap: 14px; position: relative; z-index: 1; }
  .seal { width: 236px; height: 236px; color: var(--g); }
  .seal .rings { transform-origin: 0 0; }
  .seal .ring-text { font: 600 7.4px var(--sans); letter-spacing: 0.26em; fill: var(--muted); text-transform: uppercase; }
  .seal .letter { font: 600 70px var(--display); fill: var(--g); }
  .seal .sub { font: 500 7px var(--sans); letter-spacing: 0.2em; fill: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .seal .rings { animation: turn-in 1.6s cubic-bezier(0.2, 0.7, 0.1, 1) both; }
    .seal .rings-2 { animation-duration: 2.2s; animation-direction: reverse; }
  }
  @keyframes turn-in { from { transform: rotate(-24deg); } to { transform: rotate(0deg); } }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--rule-strong);
    background: var(--card);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
    position: relative;
    z-index: 1;
  }
  .toggle:hover { border-color: var(--ink); }
  .toggle[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .toggle svg { width: 14px; height: 14px; }

  .row-2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
  .row-2b { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 22px; align-items: start; }

  /* Decision */
  .decide { background: var(--accent-wash); border-color: color-mix(in oklab, var(--accent) 22%, transparent); box-shadow: none; }
  .verdict { display: flex; align-items: center; gap: 12px; margin: 18px 0 20px; }
  .verdict-mark { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--card); flex: none; }
  .verdict-mark svg { width: 16px; height: 16px; }
  .verdict-text { font: 500 23px/1.15 var(--display); letter-spacing: -0.01em; }
  .field { display: grid; gap: 8px; }
  .money {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 4px 12px;
  }
  .money:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
  .money input {
    border: 0;
    outline: none;
    background: none;
    width: 100%;
    padding: 6px 0;
    font: 400 20px/1 var(--mono);
    font-stretch: 87.5%;
  }
  .money span { color: var(--muted); font-family: var(--mono); }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .figures { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; margin-top: 20px; padding-top: 18px; border-top: 1px solid color-mix(in oklab, var(--accent) 22%, transparent); }
  .figures div { display: grid; gap: 4px; }
  .figures .v { font: 400 18px/1.2 var(--mono); font-stretch: 87.5%; }
  .insure {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
  }
  .btn {
    border: 0;
    background: var(--ink);
    color: var(--paper);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
  }
  .btn:hover { background: var(--accent); color: var(--accent-ink); }
  .btn:disabled { background: var(--paper-2); color: var(--muted); cursor: default; }

  /* Reasons */
  .reasons { display: grid; }
  .reason {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 18px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  .reason:last-child { border-bottom: 0; }
  .reason-name { font-size: 13.5px; }
  .reason-val { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .reason-val b { color: var(--ink-2); font-weight: 500; }
  .bar { position: relative; height: 22px; }
  .bar::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--rule-strong); }
  .bar i { position: absolute; top: 9px; height: 4px; border-radius: 2px; }
  .bar i::after { content: ""; position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: inherit; }
  .bar i.up { left: 50%; background: var(--crit); }
  .bar i.up::after { right: -5px; }
  .bar i.down { right: 50%; background: var(--good); }
  .bar i.down::after { left: -5px; }
  .axis-keys { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  .axis-keys div { display: flex; justify-content: space-between; }

  /* Charts */
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .tick { fill: var(--faint); font: 400 10px var(--mono); font-stretch: 87.5%; }
  .chart .note { fill: var(--muted); font: 500 10.5px var(--sans); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .stats div { display: grid; gap: 4px; }
  .stats .v { font: 400 19px/1.2 var(--mono); font-stretch: 87.5%; }
  .empty {
    border-radius: 12px;
    background: var(--paper);
    padding: 22px;
    color: var(--ink-2);
    font-size: 13.5px;
    line-height: 1.65;
  }
  .empty b { font-weight: 600; }

  /* Network */
  .graph text { font: 500 11.5px var(--sans); fill: var(--ink); }
  .graph .gsub { font: 400 10px var(--mono); font-stretch: 87.5%; fill: var(--muted); }
  .graph .person text { fill: var(--ink-2); font-weight: 400; font-style: italic; font-family: var(--display); font-size: 13px; }
  .graph .co { cursor: pointer; }
  .graph .co:hover rect.chip, .graph .co:focus rect.chip { stroke: var(--ink); }
  .graph .co.dead { cursor: default; }
  .keys { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .keys span { display: inline-flex; align-items: center; gap: 7px; }
  .keys i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; }
  .tag.crit { color: var(--crit); background: color-mix(in oklab, var(--crit) 12%, transparent); }
  .tag.warn { color: var(--warn); background: color-mix(in oklab, var(--warn) 14%, transparent); }
  .tag.good { color: var(--good); background: color-mix(in oklab, var(--good) 12%, transparent); }

  /* Events */
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 91px; top: 10px; bottom: 10px; width: 1px; background: var(--rule); }
  .timeline li { display: grid; grid-template-columns: 78px 28px minmax(0, 1fr); align-items: start; padding: 8px 0; font-size: 13.5px; }
  .timeline time { font: 400 11px/1.9 var(--mono); font-stretch: 87.5%; color: var(--muted); }
  .timeline .node { width: 9px; height: 9px; border-radius: 50%; margin: 6px 0 0 9px; box-shadow: 0 0 0 3px var(--card); position: relative; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  thead th { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); border-bottom-color: var(--rule-strong); }
  td.num { font-family: var(--mono); font-stretch: 87.5%; font-size: 12.5px; }
  td.pos { color: var(--good); } td.neg { color: var(--crit); }
  tbody tr:last-child td { border-bottom: 0; }
  tr.go { cursor: pointer; }
  tr.go:hover td { background: var(--paper); }

  /* ---------- portfolio ---------- */
  .page-head { display: grid; gap: 10px; margin-bottom: 26px; max-width: 760px; }
  .page-title { font: 500 clamp(34px, 4.6vw, 54px)/1.02 var(--display); letter-spacing: -0.025em; }
  .page-title i { font-weight: 400; color: var(--accent); }
  .lede { font-size: 15.5px; color: var(--ink-2); max-width: 64ch; line-height: 1.6; margin: 0; }
  .strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 16px;
    box-shadow: var(--lift);
    margin-bottom: 22px;
  }
  .strip > div { padding: 20px 22px; display: grid; gap: 6px; align-content: start; }
  .strip > div + div { border-left: 1px solid var(--rule); }
  .strip .v { font: 400 30px/1.05 var(--display); letter-spacing: -0.02em; }
  .strip .sub { font-size: 12.5px; color: var(--muted); }
  .alerts { list-style: none; margin: 0; padding: 0; }
  .alerts li + li { border-top: 1px solid var(--rule); }
  .alerts button {
    width: 100%;
    background: none;
    border: 0;
    text-align: left;
    padding: 12px 0;
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: start;
    cursor: pointer;
  }
  .alerts button:hover .a-co { color: var(--accent); }
  .alerts .flag { margin-top: 7px; width: 8px; height: 8px; }
  .a-co { font-weight: 500; }
  .a-msg { font-size: 13px; color: var(--muted); }
  .a-lvl { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: 0.1em; padding-top: 4px; }

  /* ---------- model ---------- */
  .versus { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin-bottom: 22px; }
  .versus .panel { display: grid; gap: 6px; align-content: start; }
  .versus .v { font: 400 46px/1 var(--display); letter-spacing: -0.03em; }
  .versus .v.accent { color: var(--accent); font-style: italic; }
  .versus .sub { font-size: 12.5px; color: var(--muted); }
  .cal-bars { display: flex; flex-direction: column; gap: 3px; width: 120px; margin-left: auto; }
  .cal-bars i { height: 4px; border-radius: 2px; display: block; }
  .fine { font-size: 12.5px; color: var(--muted); margin: 14px 0 0; line-height: 1.6; max-width: 80ch; }
  .caveat {
    margin-top: 26px;
    border-left: 2px solid var(--warn);
    padding: 4px 0 4px 16px;
    font-size: 13px;
    color: var(--ink-2);
    max-width: 78ch;
    line-height: 1.6;
  }

  /* ---------- pricing ---------- */
  .tiers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
  .tier { display: flex; flex-direction: column; gap: 16px; }
  .tier-name { font: 500 22px/1 var(--display); }
  .tier-price { font: 400 44px/1 var(--display); letter-spacing: -0.03em; }
  .tier-price small { font: 400 13px var(--sans); color: var(--muted); letter-spacing: 0; margin-left: 4px; }
  .tier ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 13.5px; }
  .tier li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; }
  .tier li::before { content: ""; width: 10px; height: 6px; margin-top: 6px; border-left: 1.5px solid var(--accent); border-bottom: 1.5px solid var(--accent); transform: rotate(-45deg); }
  .tier .for { font-size: 13px; color: var(--muted); }
  .tier.hero { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tier.hero .for, .tier.hero .tier-price small { color: color-mix(in oklab, var(--paper) 65%, transparent); }
  .tier.hero li::before { border-color: var(--accent); }
  .tier .coop {
    margin-top: auto;
    border-radius: 10px;
    padding: 12px;
    font-size: 12.5px;
    background: color-mix(in oklab, var(--accent) 22%, transparent);
    color: inherit;
  }
  .yes { color: var(--good); font-weight: 500; }
  .no { color: var(--crit); }
  td.wrap { white-space: normal; min-width: 150px; }

  /* ---------- responsive ---------- */
  @media (max-width: 1180px) {
    .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row-2, .row-2b { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 960px) {
    .desk { grid-template-columns: minmax(0, 1fr); }
    .ledger { position: static; max-height: 380px; }
    .cert { grid-template-columns: minmax(0, 1fr); }
    .seal-wrap { order: -1; justify-items: start; }
    .seal { width: 176px; height: 176px; }
    .versus { grid-template-columns: minmax(0, 1fr); }
    .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .strip > div:nth-child(3) { border-left: 0; }
    .strip > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
  }
  @media (max-width: 620px) {
    main, .mast-inner { padding-inline: 16px; }
    .mast-inner { flex-wrap: wrap; gap: 4px 20px; padding-block: 10px 0; }
    .tabs { order: 3; width: 100%; gap: 20px; overflow-x: auto; }
    .tabs a { padding-bottom: 10px; }
    .stamp { font-size: 9.5px; }
    .panel { padding: 18px; border-radius: 14px; }
    .cert { padding: 24px 20px 20px; }
    .tiers, .strip { grid-template-columns: minmax(0, 1fr); }
    .strip > div + div { border-left: 0; border-top: 1px solid var(--rule); }
    .reason { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .axis-keys { display: none; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
